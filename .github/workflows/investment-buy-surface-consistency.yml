name: Investment BUY surface consistency (draft)

on:
  pull_request:
    paths:
      - "tests/audit_investment_buy_surface_consistency.py"
      - "tests/diagnose_stocks_ui_render.py"
      - "tests/test_investment_buy_surface_consistency.py"
      - ".github/workflows/investment-buy-surface-consistency.yml"
      - "investment_live_readiness.py"
      - "stock_app.py"
      - "prepared_priority_investments/summary.json"
      - "prepared_priority_investments/manifest.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-buy-surface-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Stocks dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile production Stocks and read-only audit
        run: python -m py_compile stock_app.py investment_live_readiness.py tests/audit_investment_buy_surface_consistency.py
      - name: Verify existing Investment readiness and price-date regressions
        run: |
          python -m unittest discover -s tests -p test_investment_live_readiness.py -v
          python -m unittest discover -s tests -p test_investment_price_freshness.py -v
          python -m unittest test_investment_technicals -v
      - name: Audit actual Investment BUYs and Home/Opportunities/Quick/Portfolio overlays
        run: python tests/audit_investment_buy_surface_consistency.py
      - name: Smoke-test the actual Stocks Streamlit server entrypoint
        # Full 7k-line browser/AppTest execution invokes background provider
        # and custom browser storage components and exceeded CI's 40-50s
        # scripted-render timeout. This smoke verifies server startup ONLY.
        # Real Investment loader and Quick Analysis BUY consistency are audited
        # above separately; full browser interaction remains a release gate.
        shell: bash
        run: |
          set -euo pipefail
          python -m streamlit run stock_app.py --server.headless true --server.port 8777 --browser.gatherUsageStats false > /tmp/cl-stocks-ui.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:8777/_stcore/health >/dev/null; then
              echo "Stocks Streamlit server health endpoint returned HTTP 200"
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat /tmp/cl-stocks-ui.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/cl-stocks-ui.log
          exit 1
      - name: Require every Stocks Streamlit tab to render with zero exceptions
        run: python tests/diagnose_stocks_ui_render.py
