name: Investment technical backfill

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/investment-technical-backfill-kick.txt"
  workflow_run:
    workflows: ["Nightly investment scans", "Weekend investment fundamentals backfill"]
    branches: [main]
    types: [completed]
  schedule:
    - cron: "30 * * * *"

permissions:
  contents: write

concurrency:
  group: investment-technical-cache
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fill technicals for eligible companies on completed exchanges
        env:
          PYTHONUNBUFFERED: "1"
        run: python scheduled_investment_technicals.py --max-symbols-per-exchange 50
      - name: Save Investment technical cache
        if: always()
        shell: bash
        run: |
          if [ ! -d prepared_investment_technicals ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prepared_investment_technicals
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Backfill prepared Investment technicals"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            # Revalidate against any fundamental changes saved during calculation.
            python scheduled_investment_technicals.py --reconcile-only
            git add prepared_investment_technicals
            if ! git diff --cached --quiet; then
              git commit -m "Reconcile Investment technical eligibility"
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
