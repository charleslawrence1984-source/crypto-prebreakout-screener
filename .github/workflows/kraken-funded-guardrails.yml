name: Kraken Funded guardrail checks

on:
  push:
    paths:
      - "kraken_funded.py"
      - "funded_stock_breakout.py"
      - "funded_stock_data.py"
      - "funded_stock_events.py"
      - "funded_stock_backtest.py"
      - "funded_stock_paper.py"
      - "requirements.txt"
      - "tests/test_kraken_funded_contract.py"
      - "tests/test_funded_stock_breakout.py"
      - "tests/test_funded_stock_data.py"
      - "tests/test_funded_stock_events.py"
      - "tests/test_funded_stock_backtest.py"
      - "tests/test_funded_stock_paper.py"
      - ".github/workflows/kraken-funded-guardrails.yml"
  pull_request:
    paths:
      - "kraken_funded.py"
      - "funded_stock_breakout.py"
      - "funded_stock_data.py"
      - "funded_stock_events.py"
      - "funded_stock_backtest.py"
      - "funded_stock_paper.py"
      - "requirements.txt"
      - "tests/test_kraken_funded_contract.py"
      - "tests/test_funded_stock_breakout.py"
      - "tests/test_funded_stock_data.py"
      - "tests/test_funded_stock_events.py"
      - "tests/test_funded_stock_backtest.py"
      - "tests/test_funded_stock_paper.py"
      - ".github/workflows/kraken-funded-guardrails.yml"

jobs:
  funded-guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install stock test and earnings-parser dependencies
        run: python -m pip install "numpy>=1.26,<3" "pandas>=2.2,<3" "beautifulsoup4>=4.12,<5" "html5lib>=1.1,<2" "lxml>=4.9,<7" "lxml_html_clean>=0.4,<1"
      - name: Compile Kraken Funded and stock breakout modules
        run: python -m py_compile kraken_funded.py funded_stock_breakout.py funded_stock_data.py funded_stock_events.py funded_stock_backtest.py funded_stock_paper.py
      - name: Run safety and stock breakout regression tests
        run: python -m unittest discover -s tests -p test_kraken_funded_contract.py -v && python -m unittest discover -s tests -p test_funded_stock_breakout.py -v && python -m unittest discover -s tests -p test_funded_stock_data.py -v && python -m unittest discover -s tests -p test_funded_stock_events.py -v && python -m unittest discover -s tests -p test_funded_stock_backtest.py -v && python -m unittest discover -s tests -p test_funded_stock_paper.py -v
