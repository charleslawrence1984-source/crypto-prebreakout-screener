name: Alpaca Yahoo 252-session price research audit (READ ONLY)

on:
  pull_request:
    paths:
      - trade_alpaca_yahoo_pair_audit.py
      - tests/test_trade_alpaca_yahoo_pair_audit.py
      - tests/test_trade_alpaca_yahoo_audit_gate.py
      - trade_alpaca_yahoo_audit_gate.py
      - .github/workflows/alpaca-yahoo-252-session-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run synthetic missingness and technical parity regressions
        run: |
          python -m py_compile trade_alpaca_yahoo_pair_audit.py trade_alpaca_yahoo_audit_gate.py
          python -m unittest discover -s tests -p 'test_trade_alpaca_yahoo*.py' -v
      - name: PR test MUST remain secretless
        if: github.event_name == 'pull_request'
        run: python trade_alpaca_yahoo_pair_audit.py --output alpaca_yahoo_252_metadata.json
      - name: User-manual real comparison with existing private paper secrets
        if: github.event_name == 'workflow_dispatch'
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_FREE_RESEARCH_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_FREE_RESEARCH_SECRET_KEY }}
          ALPACA_PERSONAL_RESEARCH_RIGHTS_CONFIRMED: ${{ vars.ALPACA_PERSONAL_RESEARCH_RIGHTS_CONFIRMED }}
        run: python trade_alpaca_yahoo_pair_audit.py --output alpaca_yahoo_252_metadata.json
      - name: PR guard - never read Alpaca credentials or claim comparison
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('alpaca_yahoo_252_metadata.json').read_text())
          assert report['credentials_present'] is False
          assert report['paper_account_verified'] is False
          assert report['paper_or_live_orders'] is False
          assert report['production_signals_modified'] is False
          print('PR_SYNTHETIC_ONLY_NO_REAL_PRICE_COMPARISON')
          PY
      - name: Manual historical source analysis - warn on discrepancies, fail on operational issues
        if: github.event_name == 'workflow_dispatch'
        run: python trade_alpaca_yahoo_audit_gate.py --receipt alpaca_yahoo_252_metadata.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpaca-yahoo-252-session-private-metadata
          path: alpaca_yahoo_252_metadata.json
          if-no-files-found: warn
          retention-days: 30
