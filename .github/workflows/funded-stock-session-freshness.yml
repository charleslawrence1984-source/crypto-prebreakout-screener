name: Kraken Funded NYSE completed-session freshness regression

on:
  pull_request:
    paths:
      - "funded_stock_data.py"
      - "funded_forward_runner.py"
      - "tests/test_funded_stock_data.py"
      - "requirements.txt"
      - ".github/workflows/funded-stock-session-freshness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stock-session-guard-tests:
    name: Validate NYSE session-aware stock freshness (no market-data calls)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install stock-history and exchange-calendar test dependencies
        run: python -m pip install "pandas>=2.2,<3" "numpy>=2,<3" "exchange-calendars>=4.9,<5"
      - name: Compile stock guard and research entry point
        run: python -m py_compile funded_stock_data.py funded_forward_runner.py
      - name: Run deterministic NYSE session, holiday and retry regression tests
        run: python -m unittest discover -s tests -p test_funded_stock_data.py -v
