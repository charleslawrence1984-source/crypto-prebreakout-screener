name: Crypto all-market pipeline

on:
  workflow_dispatch:
  push:
    paths:
      - "crypto_market_pipeline.py"
      - ".github/workflows/crypto-market-pipeline.yml"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: crypto-all-market-pipeline
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore previous Crypto data state
        shell: bash
        run: |
          git fetch origin crypto-data:refs/remotes/origin/crypto-data || true
          if git rev-parse --verify origin/crypto-data >/dev/null 2>&1; then
            git checkout origin/crypto-data -- prepared_crypto 2>/dev/null || true
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh all-market universe, discovery batch and active monitor
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python crypto_market_pipeline.py \
            --quote USDT \
            --min-quote-volume 5000000 \
            --batch-size 150 \
            --max-active 150 \
            --concurrency 10

      - name: Persist Crypto pipeline state to data branch
        if: always()
        shell: bash
        run: |
          if [ ! -d prepared_crypto ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prepared_crypto
          git commit -m "Update all-market Crypto pipeline" || true
          for attempt in 1 2 3; do
            if git push --force-with-lease origin HEAD:crypto-data; then
              exit 0
            fi
            git fetch origin crypto-data:refs/remotes/origin/crypto-data || true
            sleep $((attempt * 5))
          done
          exit 1
