name: Stocks Trade cached completed-bar provenance (research only)

on:
  pull_request:
    paths:
      - "trade_session_provenance_audit.py"
      - "tests/test_trade_session_provenance_audit.py"
      - ".github/workflows/stocks-trade-session-provenance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-bar-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test provenance and no false completeness
        run: python -m unittest discover -s tests -p test_trade_session_provenance_audit.py -v
      - name: Audit ALL real checked-in prepared Trade technical gzip cache rows
        run: python trade_session_provenance_audit.py --output trade_session_provenance_audit.json
      - name: Save immutable read-only inspection results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stocks-trade-bar-provenance
          path: trade_session_provenance_audit.json
          retention-days: 30
          if-no-files-found: warn
