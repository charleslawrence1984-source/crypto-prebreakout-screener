name: Kraken Funded official OHLCVT range archive discovery (PR ONLY)

# Bounded, public-data metadata only. NO full ZIP downloads or scheduled runs.
on:
  pull_request:
    paths:
      - "scripts/kraken_archive_range_probe.py"
      - "tests/test_kraken_archive_range_probe.py"
      - "scripts/kraken_archive_selective_extract.py"
      - "tests/test_kraken_archive_selective_extract.py"
      - "scripts/funded_kraken_multiyear_replay.py"
      - "tests/test_funded_kraken_multiyear_replay.py"
      - "scripts/kraken_archive_33_coverage.py"
      - "docs/funded_kraken_official_archive_phase3.md"
      - ".github/workflows/funded-kraken-official-archive-probe.yml"

permissions:
  contents: read

concurrency:
  group: funded-kraken-archive-research-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-range-client:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate strict read-only range ZIP reader
        run: python -m unittest discover -s tests -p test_kraken_archive_range_probe.py -v
      - name: Validate exact archived pair selection and missing-interval reporting
        run: python -m unittest discover -s tests -p test_kraken_archive_selective_extract.py -v

  catalog-official-q3-increment:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Catalog Kraken official Q3 ZIP metadata only by <=20MB range budget
        run: PYTHONPATH=. python scripts/kraken_archive_range_probe.py --quarter 2026Q3 --out funded-archive-catalog
      - name: Preserve read-only Kraken range catalog
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funded-kraken-official-q3-range-catalog-${{ github.run_id }}
          path: funded-archive-catalog/*
          if-no-files-found: warn
          retention-days: 30

  extract-selected-q3-pairs:
    needs: [verify-range-client]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extract at most 5 Kraken Q3 spot USD pairs by 60MB byte-range budget
        run: PYTHONPATH=. python scripts/kraken_archive_selective_extract.py --quarter 2026Q3 --coins BTC,ETH,SOL,NEAR,HBAR --min-pairs 2 --output funded-kraken-q3-selected
      - name: Preserve selected raw official source CSV and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funded-kraken-q3-selected-public-candles-${{ github.run_id }}
          path: funded-kraken-q3-selected/*
          if-no-files-found: warn
          retention-days: 30

  extract-selected-full-history-pairs:
    needs: [verify-range-client]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extract selected official full-history 4h/daily from virtual five-part ZIP
        run: PYTHONPATH=. python scripts/kraken_archive_selective_extract.py --quarter FULL --coins BTC,ETH,SOL,NEAR,HBAR --min-pairs 2 --output funded-kraken-full-selected
      - name: Preserve historical source CSV and partial-range provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funded-kraken-full-selected-5coins-${{ github.run_id }}
          path: funded-kraken-full-selected/*
          if-no-files-found: warn
          retention-days: 30

  original-rules-official-multiyear-5coin-replay:
    needs: [verify-range-client, extract-selected-q3-pairs, extract-selected-full-history-pairs]
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public Kraken research scorer dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify full + quarter source replay invariants
        run: python -m unittest discover -s tests -p test_funded_kraken_multiyear_replay.py -v
      - name: Download selected authentic full archive CSV artifacts
        uses: actions/download-artifact@v4
        with:
          name: funded-kraken-full-selected-5coins-${{ github.run_id }}
          path: kraken-full-selected
      - name: Download selected authentic Q3 archive CSV artifacts
        uses: actions/download-artifact@v4
        with:
          name: funded-kraken-q3-selected-public-candles-${{ github.run_id }}
          path: kraken-q3-selected
      - name: Verify per-CSV SHA-256, native weekly parity and original no-hindsight scoring
        run: PYTHONPATH=. python scripts/funded_kraken_multiyear_replay.py --full-dir kraken-full-selected --q3-dir kraken-q3-selected --coins BTC,ETH,SOL,NEAR,HBAR --max-anchors 250 --stride-4h 42 --min-coins 3 --out-dir funded-kraken-multiyear-report
      - name: Preserve historical as-of matched mover/nonmover evidence and exceptions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funded-kraken-verified-multiyear-asof-5coins-${{ github.run_id }}
          path: funded-kraken-multiyear-report/*
          if-no-files-found: warn
          retention-days: 30

  inventory-current-33-coin-archive-coverage:
    needs: [verify-range-client]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install only public research dependencies
        run: python -m pip install "pandas>=2.2,<3" "numpy>=2,<3"
      - name: Compare exact available FULL/Q3 240m and 1440m members for all 33 approved coins
        run: PYTHONPATH=. python scripts/kraken_archive_33_coverage.py
      - name: Preserve current-universe archive index and explicit unavailable entries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funded-kraken-33-coin-archive-coverage-${{ github.run_id }}
          path: funded-kraken-33-coin-coverage/*
          if-no-files-found: warn
          retention-days: 30

  extract-selected-full-history-all-33:
    needs: [verify-range-client]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select full-archive 240m/daily CSV for all original Kraken Funded coins
        run: PYTHONPATH=. python scripts/kraken_archive_selective_extract.py --quarter FULL --coins all --min-pairs 30 --output funded-kraken-full-all
      - name: Freeze exact source CSVs and partial-range provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funded-kraken-official-full-33coin-selected-${{ github.run_id }}
          path: funded-kraken-full-all/*
          if-no-files-found: warn
          retention-days: 30

  extract-selected-q3-history-all-33:
    needs: [verify-range-client]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select Q3 240m/daily CSV for all original Kraken Funded coins
        run: PYTHONPATH=. python scripts/kraken_archive_selective_extract.py --quarter 2026Q3 --coins all --min-pairs 30 --output funded-kraken-q3-all
      - name: Freeze Q3 source CSVs and partial-range provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funded-kraken-official-q3-33coin-selected-${{ github.run_id }}
          path: funded-kraken-q3-all/*
          if-no-files-found: warn
          retention-days: 30

  original-rules-official-multiyear-33coin-replay:
    needs: [original-rules-official-multiyear-5coin-replay, extract-selected-full-history-all-33, extract-selected-q3-history-all-33]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install original research scorer dependencies
        run: python -m pip install -r requirements.txt
      - name: Retrieve full-archive selected OHLCVT for all 33 approved coins
        uses: actions/download-artifact@v4
        with:
          name: funded-kraken-official-full-33coin-selected-${{ github.run_id }}
          path: kraken-full-selected
      - name: Retrieve Q3-archive selected OHLCVT for all 33 approved coins
        uses: actions/download-artifact@v4
        with:
          name: funded-kraken-official-q3-33coin-selected-${{ github.run_id }}
          path: kraken-q3-selected
      - name: Run original as-of crypto rules at spaced four-hour decision clocks for 33 assets
        run: PYTHONPATH=. python scripts/funded_kraken_multiyear_replay.py --full-dir kraken-full-selected --q3-dir kraken-q3-selected --coins all --max-anchors 180 --stride-4h 42 --min-coins 15 --out-dir funded-kraken-multiyear-33-report
      - name: Archive truthful full-population replay, unavailable coins and matched negative controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funded-kraken-official-multiyear-33coin-research-${{ github.run_id }}
          path: funded-kraken-multiyear-33-report/*
          if-no-files-found: warn
          retention-days: 30
