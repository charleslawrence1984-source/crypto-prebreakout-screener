name: Nightly stock freshness

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/nightly-trade-fundamentals.yml"
  workflow_dispatch:
    inputs:
      exchange:
        description: Exchange key or all
        required: true
        default: all
      batch_size:
        description: TradingView symbols per provider batch
        required: true
        default: "500"
  schedule:
    # Mirror the existing Investment updater: 22:15 UK on market weekdays.
    # Both UTC times are triggered; the timezone guard keeps only 22:15 UK
    # across GMT and BST.
    - cron: "15 21 * * 1-5"
    - cron: "15 22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: trade-fundamentals-cache
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check UK schedule
        id: schedule_guard
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run_scan=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "15 21 * * 1-5" ] && [ "$(TZ=Europe/London date +%z)" = "+0100" ]; then
            echo "run_scan=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "15 22 * * 1-5" ] && [ "$(TZ=Europe/London date +%z)" = "+0000" ]; then
            echo "run_scan=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_scan=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.schedule_guard.outputs.run_scan == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.schedule_guard.outputs.run_scan == 'true'
        run: pip install -r requirements.txt

      - name: Refresh shared Trade fundamentals and detect financial changes
        id: trade_fundamentals
        if: steps.schedule_guard.outputs.run_scan == 'true'
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python scheduled_trade_fundamentals.py \
            --exchange "${{ github.event.inputs.exchange || 'all' }}" \
            --batch-size "${{ github.event.inputs.batch_size || '500' }}"

      - name: Refresh Investment fundamentals only where financial inputs changed
        id: investment_changes
        if: always() && steps.schedule_guard.outputs.run_scan == 'true'
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          if [ -f prepared_trade_fundamentals/fundamental_changes.json ]; then
            python scheduled_investment_scan.py \
              --exchange all \
              --symbols-json prepared_trade_fundamentals/fundamental_changes.json \
              --min-market-cap-bn 0.5 \
              --workers 4
          fi

      - name: Recalculate all eligible Trade technicals after the close
        id: trade_technicals
        if: always() && steps.schedule_guard.outputs.run_scan == 'true'
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python scheduled_trade_technicals.py \
            --exchange all \
            --max-symbols-per-exchange 0 \
            --refresh-existing

      - name: Refresh Investment closing prices and valuation decisions
        id: investment_prices
        if: always() && steps.schedule_guard.outputs.run_scan == 'true'
        env:
          PYTHONUNBUFFERED: "1"
        run: python scheduled_investment_price_refresh.py

      - name: Save nightly stock freshness state
        if: always() && steps.schedule_guard.outputs.run_scan == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prepared_trade_fundamentals prepared_trade_technicals prepared_scans
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update nightly stock freshness"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
