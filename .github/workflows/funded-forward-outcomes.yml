name: Kraken Funded forward paper outcomes — READ ONLY

# Only public spot/Yahoo price candles against ORIGINAL frozen archives.
# This workflow is proposed in a draft PR; cron runs only when on main.
# Best-effort GitHub scheduler, NOT a timed broker/execution service.
on:
  workflow_dispatch:
  schedule:
    - cron: "37 23 * * *"
  pull_request:
    paths:
      - "funded_forward_outcomes.py"
      - "funded_forward_outcome_runner.py"
      - "funded_forward_evidence.py"
      - "tests/test_funded_forward_evidence.py"
      - "funded_forward_health.py"
      - "tests/test_funded_forward_outcomes.py"
      - "tests/test_funded_outcome_runner.py"
      - ".github/workflows/funded-forward-outcomes.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: funded-forward-outcomes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  read-only-forward-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public data dependencies only
        run: python -m pip install -r requirements.txt
      - name: Check prospective STOP/TARGET and archive integrity safeguards
        run: |
          python -m unittest discover -s tests -p test_funded_forward_outcomes.py -v
          python -m unittest discover -s tests -p test_funded_outcome_runner.py -v
          python -m unittest discover -s tests -p test_funded_forward_evidence.py -v
      - name: Audit original frozen stock and crypto scans against LATER completed candles
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          python funded_forward_outcome_runner.py
          --from-github
          --window-days 30
          --max-artifacts 250
          --out-dir funded-outcome-artifacts
      - name: Preserve new outcome evidence even if provider/source fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funded-forward-paper-${{ github.run_id }}-${{ github.run_attempt }}
          path: funded-outcome-artifacts/*.json
          if-no-files-found: warn
          retention-days: 90
