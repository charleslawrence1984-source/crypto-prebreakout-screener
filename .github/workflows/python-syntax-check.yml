name: Python syntax check

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "meme_app.py"
      - "meme_launch_research.py"
      - "pre_pump_research.py"
      - "crypto_rule_engine.py"
      - "crypto_market_pipeline.py"
      - "crypto_macro.py"
      - "crypto_accumulation_model.py"
      - "stock_app.py"
      - "strategy_scores_v3.py"
      - "two_strategy.py"
      - "scheduled_investment_scan.py"
      - ".github/workflows/python-syntax-check.yml"
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python files
        run: python -m py_compile app.py meme_app.py meme_launch_research.py pre_pump_research.py crypto_rule_engine.py crypto_market_pipeline.py crypto_macro.py crypto_accumulation_model.py stock_app.py strategy_scores_v3.py two_strategy.py scheduled_investment_scan.py
