name: Stock freshness audit

on:
  workflow_dispatch:
    inputs:
      deep:
        description: Run deep file-level integrity checks
        required: true
        default: "false"
  schedule:
    # Weekly integrity sweep every Sunday morning.
    - cron: "30 8 * * 0"
    # Monthly deeper audit on the first day of each month.
    - cron: "0 9 1 * *"

permissions:
  contents: write

concurrency:
  group: stock-freshness-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run freshness audit
        env:
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          DEEP=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.deep }}" = "true" ]; then
            DEEP="--deep"
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "0 9 1 * *" ]; then
            DEEP="--deep"
          fi
          python stock_freshness_audit.py $DEEP || true

      - name: Save freshness report
        if: always()
        shell: bash
        run: |
          if [ ! -d prepared_health ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prepared_health
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update stock freshness audit"
          git pull --rebase origin main
          git push origin HEAD:main
