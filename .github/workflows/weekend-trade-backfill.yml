name: Weekend trade fundamentals backfill

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/trade-backfill-kick.txt"
  schedule:
    # Gap-fill throughout Friday evening and the weekend. The script only works
    # on missing symbols and skips exchanges already at complete coverage.
    - cron: "15 */2 * * 5,6,0"

permissions:
  contents: write

concurrency:
  group: trade-fundamentals-cache
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fill missing Trade fundamentals
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python scheduled_trade_fundamentals.py \
            --exchange all \
            --batch-size 250 \
            --max-symbols-per-exchange 500 \
            --closed-markets-only \
            --resume

      - name: Save Trade fundamentals backfill
        if: always()
        shell: bash
        run: |
          if [ ! -d prepared_trade_fundamentals ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prepared_trade_fundamentals
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Backfill prepared Trade fundamentals"
          git pull --rebase origin main
          git push origin HEAD:main
