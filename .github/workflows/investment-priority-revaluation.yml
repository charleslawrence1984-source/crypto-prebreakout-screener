name: Priority investment revaluation

on:
  push:
    branches: [main]
    paths:
      - "investment_priority_symbols.json"
      - ".github/investment-priority-kick.txt"
      - ".github/workflows/investment-priority-revaluation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: investment-priority-revaluation
  cancel-in-progress: true

jobs:
  revalue:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Revalue priority Investment shortlist
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python scheduled_investment_scan.py \
            --exchange all \
            --symbols-json investment_priority_symbols.json \
            --output-dir prepared_priority_investments \
            --max-symbols 0 \
            --min-market-cap-bn 0.5 \
            --workers 2

      - name: Build priority valuation audit
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import json
          import math
          from pathlib import Path
          import pandas as pd

          rows = []
          counts = {}
          for file in sorted(glob.glob("prepared_priority_investments/*.csv.gz")):
              frame = pd.read_csv(file, compression="gzip")
              for _, row in frame.iterrows():
                  item = {}
                  for col in [
                      "Action", "Ticker", "Company", "Price", "Quality score", "Moat score",
                      "Base margin of safety %", "Required margin of safety %",
                      "Bear margin of safety %", "Valuation gate",
                      "Valuation model version", "Valuation FX status",
                      "Valuation FX rate", "Valuation FX pair",
                      "Quote currency", "Financial currency", "Decision reason",
                  ]:
                      value = row.get(col)
                      if pd.isna(value):
                          value = None
                      elif hasattr(value, "item"):
                          value = value.item()
                      item[col] = value
                  item["Prepared exchange"] = Path(file).name.replace(".csv.gz", "")
                  rows.append(item)
                  action = str(item.get("Action") or "UNKNOWN")
                  counts[action] = counts.get(action, 0) + 1

          payload = {
              "rows": rows,
              "counts": counts,
              "total": len(rows),
          }
          Path("prepared_priority_investments/summary.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({"counts": counts, "total": len(rows)}, sort_keys=True))
          PY

      - name: Save priority Investment valuations
        if: always()
        shell: bash
        run: |
          if [ ! -d prepared_priority_investments ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prepared_priority_investments
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update priority Investment revaluations"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
