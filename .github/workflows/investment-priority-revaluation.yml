name: Priority investment revaluation

on:
  push:
    branches: [main]
    paths:
      - "investment_priority_symbols.json"
      - ".github/investment-priority-kick.txt"
      - ".github/workflows/investment-priority-revaluation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: investment-priority-writes
  cancel-in-progress: false

jobs:
  revalue:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        exchange:
          - euronext_paris
          - gettex
          - lse
          - madrid
          - nasdaq
          - nyse
          - otc
          - six
          - tsx
          - vienna
          - xetra
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Revalue ${{ matrix.exchange }} prior BUY candidates
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python scheduled_investment_scan.py \
            --exchange ${{ matrix.exchange }} \
            --symbols-json investment_priority_symbols.json \
            --output-dir prepared_priority_investments \
            --max-symbols 0 \
            --min-market-cap-bn 0.5 \
            --workers 2

      - name: Save ${{ matrix.exchange }} priority valuations
        if: always()
        shell: bash
        run: |
          file="prepared_priority_investments/${{ matrix.exchange }}.csv.gz"
          if [ ! -f "$file" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$file"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Revalue ${{ matrix.exchange }} prior Investment BUY candidates"
          # scheduled_investment_scan also updates its local manifest. Each matrix
          # job owns only one exchange CSV, so discard the uncommitted shared
          # manifest before rebasing/pushing to avoid cross-job conflicts.
          git restore prepared_priority_investments/manifest.json 2>/dev/null || true
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 4))
          done
          exit 1

  summarize:
    if: always()
    needs: revalue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pandas
        run: pip install pandas

      - name: Build priority valuation audit
        shell: bash
        run: |
          git pull --rebase origin main
          python - <<'PY'
          import glob
          import json
          from pathlib import Path
          import pandas as pd

          rows = []
          counts = {}
          for file in sorted(glob.glob("prepared_priority_investments/*.csv.gz")):
              frame = pd.read_csv(file, compression="gzip")
              for _, row in frame.iterrows():
                  item = {}
                  for col in [
                      "Action", "Ticker", "Company", "Price", "Quality score", "Moat score",
                      "Base margin of safety %", "Required margin of safety %",
                      "Bear margin of safety %", "Valuation gate",
                      "Valuation model version", "Valuation FX status",
                      "Valuation FX rate", "Valuation FX pair",
                      "Quote currency", "Financial currency", "Decision reason",
                  ]:
                      value = row.get(col)
                      if pd.isna(value):
                          value = None
                      elif hasattr(value, "item"):
                          value = value.item()
                      item[col] = value
                  item["Prepared exchange"] = Path(file).name.replace(".csv.gz", "")
                  rows.append(item)
                  action = str(item.get("Action") or "UNKNOWN")
                  counts[action] = counts.get(action, 0) + 1

          payload = {"rows": rows, "counts": counts, "total": len(rows)}
          Path("prepared_priority_investments/summary.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({"counts": counts, "total": len(rows)}, sort_keys=True))
          PY

      - name: Save summary
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prepared_priority_investments/summary.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Summarize priority Investment revaluations"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 4))
          done
          exit 1
