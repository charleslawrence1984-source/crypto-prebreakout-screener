name: Separate Pension read-only route preview (DRAFT only)

on:
  pull_request:
    paths:
      - "pension_preview_page.py"
      - "pension_holdings_readonly_preflight.py"
      - "tests/test_pension_holdings_readonly_preflight.py"
      - "stock_app_v2.py"
      - "platform_home.py"
      - "tests/test_pension_navigation_preview.py"
      - ".github/workflows/pension-navigation-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-nonmigrating-pension-route:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal read-only Streamlit test dependency
        run: pip install "streamlit>=1.49,<2"
      - name: Syntax and no-migration route parity
        run: |
          python -m py_compile pension_preview_page.py stock_app_v2.py platform_home.py
          python -m unittest discover -s tests -p test_pension_navigation_preview.py -v
          python -m unittest discover -s tests -p test_pension_holdings_readonly_preflight.py -v
      - name: Read-only preview, explicitly not a migrated or released pension
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          paths=("pension_preview_page.py","stock_app_v2.py","platform_home.py")
          r={
            "readiness":"PENSION_PREVIEW_ONLY_NOT_LIVE",
            "stocks_and_pension_routes_distinct_in_draft":True,
            "browser_holdings_migrated":False,
            "local_only_legacy_partition_preview_tested":True,
            "user_holdings_mutated":False,
            "pension_trading_or_investment_buy_enabled":False,
            "original_stocks_mixed_investment_removed":False,
            "real_browser_storage_and_mobile_tested":False,
            "source_sha256":{p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths}
          }
          pathlib.Path("pension_route_preview_receipt.json").write_text(json.dumps(r,indent=2)+"\n")
          print(json.dumps(r,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pension-readonly-preview-evidence
          path: pension_route_preview_receipt.json
          if-no-files-found: warn
          retention-days: 30
