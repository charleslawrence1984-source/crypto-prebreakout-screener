name: Funded forward research capture — STOCKS and CRYPTO

# Scheduled events run from the DEFAULT branch (already live on main).
# This draft adds coverage evidence only; no new orders or trading authority.
# No broker access, no funded-account credentials, no orders or strategy edits.
on:
  workflow_dispatch:
    inputs:
      asset:
        description: "Research universe to capture (NO trade orders)"
        required: true
        type: choice
        options: [both, stocks, crypto]
        default: both
  schedule:
    - cron: "35 0,4,8,12,16,20 * * *"   # Public crypto spot proxies, every 4h
    - cron: "55 0,4,8,12,16,20 * * *"   # DRAFT ONLY: redundant source-candle retry, NOT LIVE until separate approval
    - cron: "45 22 * * 1-5"              # US stocks, after regular NY close

permissions:
  contents: read
  actions: read

concurrency:
  group: funded-forward-${{ github.ref }}-${{ github.event_name == 'schedule' && 'all-scheduled' || github.event.inputs.asset || 'all' }}
  cancel-in-progress: false

jobs:
  crypto-research:
    name: Frozen crypto research observations (33 coins)
    if: github.event.schedule == '35 0,4,8,12,16,20 * * *' || github.event.schedule == '55 0,4,8,12,16,20 * * *' || (github.event_name == 'workflow_dispatch' && (inputs.asset == 'both' || inputs.asset == 'crypto'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public market research dependencies
        run: python -m pip install -r requirements.txt
      - name: Check actual completed four-hour source and prior SHA-valid captured archive
        id: admission
        if: github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python funded_capture_schedule_admission.py --out-dir funded-schedule-admission-evidence
      - name: Record prospective crypto technical observations (not funded orders)
        if: github.event_name != 'schedule' || steps.admission.outputs.capture == 'true'
        run: python funded_forward_runner.py --asset crypto --out-dir funded-forward-artifacts
      - name: Audit frozen Crypto research coverage and rejected PASS labels
        if: success() && (github.event_name != 'schedule' || steps.admission.outputs.capture == 'true')
        run: python funded_forward_health.py --asset crypto --path funded-forward-artifacts
      - name: Retain a source-backed decision for capture/skip/late/API failure
        if: always() && github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: funded-schedule-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: funded-schedule-admission-evidence/*.json
          if-no-files-found: warn
          retention-days: 90
      - name: Save unique research artifact, including failed-provider diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funded-crypto-${{ github.run_id }}-${{ github.run_attempt }}
          path: funded-forward-artifacts/*.json
          if-no-files-found: warn
          retention-days: 90

  stock-research:
    name: Frozen stock research observations (30 tickers)
    if: github.event.schedule == '45 22 * * 1-5' || (github.event_name == 'workflow_dispatch' && (inputs.asset == 'both' || inputs.asset == 'stocks'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public market research dependencies
        run: python -m pip install -r requirements.txt
      - name: Record prospective stock technical observations (not funded orders)
        run: python funded_forward_runner.py --asset stocks --out-dir funded-forward-artifacts
      - name: Audit frozen Stock research coverage and short-history gaps
        if: success()
        run: python funded_forward_health.py --asset stocks --path funded-forward-artifacts
      - name: Save unique research artifact, including failed-provider diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funded-stocks-${{ github.run_id }}-${{ github.run_attempt }}
          path: funded-forward-artifacts/*.json
          if-no-files-found: warn
          retention-days: 90
